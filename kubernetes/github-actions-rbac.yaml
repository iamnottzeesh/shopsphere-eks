apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shopsphere-product-service-deployer
  namespace: shopsphere
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["product-service"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shopsphere-product-service-deployer
  namespace: shopsphere
subjects:
  - kind: Group
    name: shopsphere-ci-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: shopsphere-product-service-deployer
  apiGroup: rbac.authorization.k8s.io
