name: ShopSphere Product Service Build and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the new image to shopsphere/product-service"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: shopsphere-product-service-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 121973526749.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: shopsphere-product-service
  EKS_CLUSTER_NAME: shopsphere-eks
  K8S_NAMESPACE: shopsphere
  K8S_DEPLOYMENT: product-service
  K8S_CONTAINER: product-service

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_digest: ${{ steps.image.outputs.image_digest }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js for regression tests
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies and run regression tests
        working-directory: services/product-service
        run: |
          npm ci
          npm test

      - name: Define unique image tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="sha-${GITHUB_SHA:0:12}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$TAG"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Image: $IMAGE"

      - name: Build product-service image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --tag "$IMAGE" \
            --file services/product-service/Dockerfile \
            services/product-service

      - name: Smoke test container health
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach \
            --name product-service-smoke \
            "$IMAGE"

          trap 'docker logs product-service-smoke || true; docker rm --force product-service-smoke || true' EXIT

          healthy=false

          for attempt in $(seq 1 30); do
            if docker exec product-service-smoke node -e '
              fetch("http://127.0.0.1:3000/health")
                .then(async response => {
                  if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                  }

                  const body = await response.json();

                  if (body.status !== "healthy") {
                    throw new Error("Unhealthy response");
                  }

                  console.log(JSON.stringify(body));
                })
                .catch(error => {
                  console.error(error.message);
                  process.exit(1);
                });
            '; then
              healthy=true
              break
            fi

            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo "Container health check failed."
            exit 1
          fi

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::121973526749:role/shopsphere-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: shopsphere-product-service-release
          retry-max-attempts: 2

      - name: Log in to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

      - name: Push image and capture digest
        id: image
        shell: bash
        run: |
          set -euo pipefail

          docker push "$IMAGE"

          IMAGE_DIGEST="$(docker image inspect "$IMAGE" \
            --format '{{index .RepoDigests 0}}')"

          if [[ "$IMAGE_DIGEST" != "$ECR_REGISTRY/$ECR_REPOSITORY@sha256:"* ]]; then
            echo "Unexpected image digest: $IMAGE_DIGEST"
            exit 1
          fi

          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

          {
            echo "## Product-service image"
            echo "- Tag: \`$IMAGE\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cluster-compatible kubectl
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER_VERSION="$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.version' \
            --output text \
            --no-cli-pager)"

          KUBECTL_VERSION="$(curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/stable-${CLUSTER_VERSION}.txt")"

          DOWNLOAD_DIR="$(mktemp -d)"
          cd "$DOWNLOAD_DIR"

          curl --fail --silent --show-error --location \
            --output kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"

          curl --fail --silent --show-error --location \
            --output kubectl.sha256 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"

          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

          kubectl version --client

      - name: Configure kubeconfig
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --alias shopsphere-ci

      - name: Record previous image
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          PREVIOUS_IMAGE="$(kubectl get deployment product-service \
            --namespace shopsphere \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="product-service")].image}')"

          test -n "$PREVIOUS_IMAGE"

          echo "PREVIOUS_IMAGE=$PREVIOUS_IMAGE" >> "$GITHUB_ENV"
          echo "Previous image: $PREVIOUS_IMAGE"
          echo "- Previous image: \`$PREVIOUS_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy image by digest and wait for rollout
        id: deploy
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail

          kubectl set image deployment/product-service \
            "product-service=$IMAGE_DIGEST" \
            --namespace shopsphere

          kubectl rollout status deployment/product-service \
            --namespace shopsphere \
            --timeout=300s

          kubectl get deployment product-service \
            --namespace shopsphere \
            -o wide

          echo "- Rollout: completed" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect rollout failure diagnostics
        if: ${{ failure() && inputs.deploy && steps.deploy.outcome == 'failure' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -uo pipefail

          kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" -o wide \
            --request-timeout=20s || true

          kubectl describe deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            --request-timeout=20s || true

          kubectl get pods -n "$K8S_NAMESPACE" \
            -l app=product-service -o wide \
            --request-timeout=20s || true

          kubectl get events -n "$K8S_NAMESPACE" \
            --sort-by=.metadata.creationTimestamp \
            --request-timeout=20s | tail -n 50 || true

      - name: Restore previous image after rollout failure
        if: ${{ failure() && inputs.deploy && steps.deploy.outcome == 'failure' }}
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail

          : "${PREVIOUS_IMAGE:?Previous image was not recorded}"
          : "${IMAGE_DIGEST:?Release image was not recorded}"

          CURRENT_IMAGE="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" --request-timeout=20s \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="product-service")].image}')"

          if [ "$CURRENT_IMAGE" = "$PREVIOUS_IMAGE" ]; then
            echo "- Recovery: previous image already configured; no change made" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$CURRENT_IMAGE" != "$IMAGE_DIGEST" ]; then
            echo "::error::Live image differs from this release; refusing overwrite."
            echo "- Recovery: refused because live image changed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          kubectl set image "deployment/$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER=$PREVIOUS_IMAGE" \
            -n "$K8S_NAMESPACE" --request-timeout=20s

          kubectl rollout status "deployment/$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" --timeout=300s \
            --request-timeout=20s

          echo "- Recovery: previous image restored and rollout completed" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify external product-service endpoints
        if: ${{ success() && inputs.deploy }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail

          LB_HOST="$(kubectl get service product-service \
            -n "$K8S_NAMESPACE" --request-timeout=20s \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"

          test -n "$LB_HOST"
          BASE_URL="http://$LB_HOST"
          verified=false
          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHECK_DIR"' EXIT

          for attempt in $(seq 1 6); do
            echo "Endpoint verification attempt $attempt/6"

            if curl --fail --silent --show-error \
                 --connect-timeout 5 --max-time 10 \
                 "$BASE_URL/health" -o "$CHECK_DIR/health.json" \
              && jq -e 'type == "object" and .status == "healthy" and .service == "shopsphere-product-service"' \
                 "$CHECK_DIR/health.json" \
              && curl --fail --silent --show-error \
                 --connect-timeout 5 --max-time 10 \
                 "$BASE_URL/products" -o "$CHECK_DIR/products.json" \
              && jq -e 'type == "object" and (.products | type == "array") and (.count | type == "number") and .count == (.products | length)' \
                 "$CHECK_DIR/products.json"; then
              verified=true
              break
            fi

            sleep 5
          done

          if [ "$verified" != true ]; then
            echo "::error::External endpoint verification failed."
            echo "- External checks: FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "- External checks: health and products passed" >> "$GITHUB_STEP_SUMMARY"

  record-release:
    name: Record verified release in Git
    needs: build-and-deploy
    if: ${{ success() && inputs.deploy && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      RELEASE_IMAGE: ${{ needs.build-and-deploy.outputs.image_digest }}

    steps:
      - name: Checkout main for release recording
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Update manifest to verified release digest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          image = os.environ["RELEASE_IMAGE"]
          prefix = (
              os.environ["ECR_REGISTRY"] + "/"
              + os.environ["ECR_REPOSITORY"] + "@sha256:"
          )

          if not re.fullmatch(re.escape(prefix) + r"[0-9a-f]{64}", image):
              raise SystemExit("STOP: invalid release image reference.")

          path = Path("kubernetes/product-service.yaml")
          text = path.read_text()
          pattern = (
              r"(?m)^([ \t]*image:[ \t]*)"
              + re.escape(prefix)
              + r"[0-9a-f]{64}([ \t]*)$"
          )

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + image + m.group(2),
              text,
          )

          if count != 1:
              raise SystemExit("STOP: expected exactly one product image line.")

          path.write_text(updated)
          PY

          git diff --check
          git diff -- kubernetes/product-service.yaml

      - name: Open release-recording pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- kubernetes/product-service.yaml; then
            echo "- Release recording: manifest already matches" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="release/product-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- kubernetes/product-service.yaml
          git commit -m "chore: record verified product-service release"
          git push origin "HEAD:refs/heads/$BRANCH"

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          BODY="$(printf '%s\n\n%s\n\n%s\n\n%s' \
            'Records the image from a successful deployment and external endpoint check.' \
            "Image: $RELEASE_IMAGE" \
            "Workflow run: $RUN_URL" \
            'Post-deployment snapshot only. Verify against the current live image before merging; a newer release may supersede this PR.')"

          PR_URL="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "chore: record product-service release $GITHUB_RUN_ID" \
            --body "$BODY")"

          echo "- Release-recording PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

          # Test the release PR head, not the deployment workflow's main ref.
          gh workflow run service-tests.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH"

          echo "- Service tests requested on: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
