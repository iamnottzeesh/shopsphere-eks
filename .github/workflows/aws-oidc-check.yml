name: ShopSphere AWS OIDC Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect OIDC claims safely
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );

            core.info(JSON.stringify({
              sub: claims.sub,
              aud: claims.aud,
              iss: claims.iss,
              repository: claims.repository,
              repository_id: claims.repository_id,
              repository_owner_id: claims.repository_owner_id,
              ref: claims.ref
            }, null, 2));

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::121973526749:role/shopsphere-github-actions-role
          aws-region: ap-south-1
          role-session-name: shopsphere-oidc-check
          retry-max-attempts: 2

      - name: Verify AWS identity
        run: aws sts get-caller-identity
