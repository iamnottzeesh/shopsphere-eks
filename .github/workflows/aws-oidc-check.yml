name: ShopSphere AWS OIDC Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::121973526749:role/shopsphere-github-actions-role
          aws-region: ap-south-1
          role-session-name: shopsphere-oidc-check
          allowed-account-ids: "121973526749"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify EKS describe permission
        run: |
          aws eks describe-cluster \
            --region ap-south-1 \
            --name shopsphere-eks \
            --query 'cluster.{Name:name,Status:status,Version:version}' \
            --output json
