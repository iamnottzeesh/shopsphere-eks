name: ShopSphere AWS OIDC Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: shopsphere-eks

jobs:
  verify-aws:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::121973526749:role/shopsphere-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: shopsphere-oidc-check
          retry-max-attempts: 2

      - name: Verify AWS identity
        run: aws sts get-caller-identity --no-cli-pager

      - name: Verify EKS describe permission
        run: |
          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.{Name:name,Status:status,Version:version,Arn:arn}' \
            --output json \
            --no-cli-pager
