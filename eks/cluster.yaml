apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: shopsphere-eks
  region: ap-south-1
  version: "1.37"

vpc:
  id: vpc-0ca18035aee97be58
  subnets:
    public:
      ap-south-1a:
        id: subnet-06a6d8f382e04e235
      ap-south-1b:
        id: subnet-00b9f2ed6c784f396
    private:
      ap-south-1a:
        id: subnet-07cfaeb3630c9bdfb
      ap-south-1b:
        id: subnet-08171e6b0d7a57a41

managedNodeGroups:
  - name: shopsphere-workers-v2
    instanceType: c7i-flex.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: true
    iam:
      instanceRoleARN: arn:aws:iam::121973526749:role/shopsphere-eks-node-role
    labels:
      role: workers
    tags:
      nodegroup-role: worker
